<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poketurismo · Album luoghi e ricambi</title><style>
@font-face{font-family:VT323;src:url('/previews/pixel-cars/vt323.woff2')}*{box-sizing:border-box}body{margin:0;padding:12px;background:#008080;color:#000;font:20px VT323,monospace}main{max-width:1150px;margin:auto;background:#c0c0c0;border:2px outset white;padding:7px}h1{margin:0;background:#000080;color:#fff;padding:5px 8px;font-size:25px}p{margin:10px 5px}a{color:#0000ff}h2{font-size:23px;border-bottom:2px groove white;padding:5px}section>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}figure{margin:0;padding:6px;border:2px inset white;background:#dfdfdf;min-width:0}figure img{display:block;max-width:100%;width:100%;height:145px;object-fit:contain;image-rendering:pixelated;background:#c0c0c0}figure.square img{height:128px}figcaption{margin-top:6px;font-size:19px;overflow-wrap:anywhere}small{display:block;font-size:16px;color:#404040}@media(max-width:520px){body{padding:5px}section>div{grid-template-columns:1fr}figure img{height:auto;aspect-ratio:16/9}figure.square img{height:128px;aspect-ratio:auto}}
</style></head><body><main><h1>POKETURISMO · Album luoghi e ricambi</h1><p>Provincia del Nord · 2002. Pixel art delle schermate di gioco. <a href="/map">Torna alla mappa</a> · <a href="/previews/pixel-cars/">Album auto</a></p><p id="status">Apertura dell’album…</p><div id="album"></div></main><script type="module">
const response=await fetch('./catalog.json');if(!response.ok)throw Error('Album non disponibile');const rows=await response.json();const labels={places:'Luoghi della mappa e dei menu',work:'Officina e carrozziere',part:'Ricambi · Tre livelli per famiglia',tracks:'Piste e strade del Nord'};for(const [group,title]of Object.entries(labels)){const section=document.createElement('section'),heading=document.createElement('h2'),grid=document.createElement('div');heading.textContent=title;section.append(heading,grid);for(const row of rows.filter(x=>x.group===group)){const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption'),small=document.createElement('small');figure.className=group==='places'?'':'square';image.src=row.image;image.alt=row.name;image.width=row.width;image.height=row.height;caption.textContent=row.name;small.textContent=row.width+' × '+row.height+' px';caption.append(small);figure.append(image,caption);grid.append(figure);}document.querySelector('#album').append(section);}document.querySelector('#status').textContent=rows.length+' illustrazioni · Originali conservati in archivio';
</script></body></html>
