# Production: PostgreSQL 18 is managed by the Ubuntu system service.
name: poketurismo-accounts
services:
  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    network_mode: host
    environment:
      GOTRUE_API_HOST: 127.0.0.1
      GOTRUE_API_PORT: ${AUTH_PORT:-9999}
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@127.0.0.1:5434/${AUTH_DB_NAME:-poketurismo}
      GOTRUE_DB_MAX_POOL_SIZE: 5
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${AUTH_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ISSUER: ${PUBLIC_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${AUTH_EMAIL_ENABLED:-false}
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-}
      GOTRUE_SMTP_SENDER_NAME: Poketurismo
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${AUTH_TEMPLATE_URL:-http://127.0.0.1:5174/api/auth/templates/code}
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${AUTH_TEMPLATE_URL:-http://127.0.0.1:5174/api/auth/templates/code}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:$${GOTRUE_API_PORT}/health"]
      interval: 5s
      timeout: 3s
      retries: 12
